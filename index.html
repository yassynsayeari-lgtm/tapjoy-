<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YASJOY - اربح واستمتع</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7fb;
      color: #222;
    }
    header {
      background: #1976d2;
      color: white;
      padding: 22px;
      text-align: center;
    }
    .logo { font-size: 30px; font-weight: bold; }
    main {
      max-width: 600px;
      margin: 25px auto;
      padding: 15px;
    }
    .card {
      background: white;
      padding: 22px;
      margin-bottom: 18px;
      border-radius: 14px;
      box-shadow: 0 3px 12px #00000010;
    }
    h2 { color: #1976d2; }
    button {
      background: #1e88e5;
      color: white;
      border: 0;
      padding: 13px 20px;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
      width: 100%;
    }
    footer {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <header>
    <div class="logo">⭐ YASJOY</div>
    <p>اربح النقاط واستمتع بالعروض</p>
  </header>

  <main>
    <section class="card">
      <h2>مرحبًا بك في YASJOY</h2>
      <p>منصتك لاستكشاف العروض وجمع النقاط.</p>
      <button onclick="alert('سيتم تفعيل التسجيل لاحقًا')">
        إنشاء حساب
      </button>
    </section>

    <section class="card">
      <h2>🎁 جدار العروض</h2>
      <p>سيتم ربط جدار العروض بعد إعداد حساب الناشر والموافقة عليه.</p>
      <button onclick="alert('جدار العروض غير مفعّل بعد')">
        استكشاف العروض
      </button>
    </section>

    <section class="card">
      <h2>💰 رصيد النقاط</h2>
      <p>رصيدك: 0 نقطة</p>
      <p>سيتم تفعيل نظام النقاط والسحب بعد إعداد الخادم وقاعدة البيانات.</p>
    </section>
  </main>

  <footer>© 2026 YASJOY</footer>
</body>
</html>
