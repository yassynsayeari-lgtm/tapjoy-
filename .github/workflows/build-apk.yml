
name: Build YASJOY APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

      - name: Check repository files
        run: |
          echo "YASJOY repository checked."
          find . -maxdepth 3 -type f | sort

      - name: Create placeholder notice
        run: |
          mkdir -p output
          echo "Android project files are not added yet." > output/README.txt

      - name: Upload build preparation
        uses: actions/upload-artifact@v4
        with:
          name: yasjoy-build-preparation
          path: output/README.txt
      - name: Verify workflow
        run: echo "YASJOY workflow is ready"
